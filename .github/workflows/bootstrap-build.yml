name: Bootstrap build (CN)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply patch
        run: git apply --verbose ScreenRemote-CN.patch

      - name: Init submodules
        run: git submodule update --init --recursive

      - name: Select newest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)"
          echo "Using $latest"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install build tools
        run: |
          brew install ninja meson pkg-config go fmt googletest nasm protobuf
          python3 -m venv /tmp/protoc-venv
          /tmp/protoc-venv/bin/pip install --quiet grpcio-tools==1.68.1
          mkdir -p /tmp/protoc/bin
          printf '#!/bin/sh\nexec /tmp/protoc-venv/bin/python -m grpc_tools.protoc "$@"\n' > /tmp/protoc/bin/protoc
          chmod +x /tmp/protoc/bin/protoc
          echo "/tmp/protoc/bin" >> "$GITHUB_PATH"
          /tmp/protoc/bin/protoc --version
          python3 -m venv /tmp/cmake-venv
          /tmp/cmake-venv/bin/pip install --quiet cmake==3.31.6
          echo "/tmp/cmake-venv/bin" >> "$GITHUB_PATH"
          /tmp/cmake-venv/bin/cmake --version

      - name: Prepare tsnet go.mod
        run: |
          if [ ! -f porting/libtsnet/go.mod ]; then
            cd porting/libtsnet
            go mod init me.wsen.scrcpy-tsnet
            go mod edit -go=1.23
            go get tailscale.com@v1.84.1
            go mod tidy
          fi

      - name: Restore native dependencies
        uses: actions/cache/restore@v4
        with:
          path: porting/libs
          key: native-deps-v11-${{ runner.os }}

      - name: Build unsigned IPA
        run: bash scripts/build-unsigned-ipa.sh

      - name: Save native dependencies
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: porting/libs
          key: native-deps-v11-${{ runner.os }}

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "cn-$(date +%Y%m%d-%H%M)" "build/unsigned/Scrcpy-Remote-unsigned.ipa" \
            --title "Screen Remote 涓枃鐗堬紙鏈鍚?IPA锛? \
            --notes "鑷姩鏋勫缓浜х墿锛屾湭绛惧悕锛岃浣跨敤鑷繁鐨勮瘉涔︾鍚嶅悗瀹夎銆?







