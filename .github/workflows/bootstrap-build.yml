name: Bootstrap build (CN)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply patch
        run: git apply --verbose ScreenRemote-CN.patch

      - name: Init submodules
        run: git submodule update --init --recursive

      - name: Select newest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)"
          echo "Using $latest"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install build tools
        run: |
          brew install ninja meson pkg-config go fmt googletest nasm protobuf
          # protoc must be 28.3 to match the bundled protobuf 28.3 static lib
          # and headers. grpcio-tools' protoc has no C++ generator (--cpp_out
          # looks for a protoc-gen-cpp plugin), so use the official 28.3 build.
          curl -fsSL --retry 5 --retry-delay 5 \
            -o /tmp/protoc28.zip \
            https://github.com/protocolbuffers/protobuf/releases/download/v28.3/protoc-28.3-osx-aarch_64.zip
          mkdir -p /tmp/protoc
          unzip -q -o /tmp/protoc28.zip -d /tmp/protoc
          chmod +x /tmp/protoc/bin/protoc
          echo "/tmp/protoc/bin" >> "$GITHUB_PATH"
          /tmp/protoc/bin/protoc --version
          python3 -m venv /tmp/cmake-venv
          /tmp/cmake-venv/bin/pip install --quiet cmake==3.31.6
          echo "/tmp/cmake-venv/bin" >> "$GITHUB_PATH"
          /tmp/cmake-venv/bin/cmake --version

      - name: Prepare tsnet go.mod
        run: |
          if [ ! -f porting/libtsnet/go.mod ]; then
            cd porting/libtsnet
            go mod init me.wsen.scrcpy-tsnet
            go mod edit -go=1.23
            go get tailscale.com@v1.84.1
            go mod tidy
          fi

      - name: Restore native dependencies (latest)
        uses: actions/cache/restore@v4
        with:
          path: |
            porting/libs
            external/adb-mobile/output
          key: native-deps-v14-${{ runner.os }}

      - name: Restore native dependencies (older)
        uses: actions/cache/restore@v4
        with:
          path: |
            porting/libs
            external/adb-mobile/output
          key: native-deps-v12-${{ runner.os }}

      - name: Build unsigned IPA
        run: |
          set -o pipefail
          mkdir -p build
          bash scripts/build-unsigned-ipa.sh 2>&1 | tee build/build.log

      - name: Build log tail
        if: always()
        run: |
          if [ -f build/build.log ]; then
            {
              echo '```'
              tail -n 200 build/build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload build log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/build.log
          if-no-files-found: ignore

      - name: Save native dependencies
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            porting/libs
            external/adb-mobile/output
          key: native-deps-v15-${{ runner.os }}

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="cn-$(date +%Y%m%d-%H%M)"
          gh release create "$tag" "build/unsigned/Scrcpy-Remote-unsigned.ipa" \
            --title "Screen Remote CN $tag" \
            --notes "Unsigned IPA. Sign it yourself with AltStore, Sideloadly or eSign."
