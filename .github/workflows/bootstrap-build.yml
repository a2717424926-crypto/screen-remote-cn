name: Bootstrap build (CN)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply patch
        run: git apply --verbose ScreenRemote-CN.patch

      - name: Init submodules
        run: git submodule update --init --recursive

      - name: Select newest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)"
          echo "Using $latest"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install build tools
        run: |
          brew install cmake ninja meson pkg-config go fmt googletest
          # Homebrew 4.x refuses `brew install ./foo.rb`; put the pinned
          # protobuf 28.3 formula into a local tap instead.
          brew unlink protobuf || true
          tap_dir="$(brew --repository)/Library/Taps/local/homebrew-cn/Formula"
          mkdir -p "$tap_dir"
          cp ./external/adb-mobile/porting/protobuf.rb "$tap_dir/protobuf.rb"
          brew install local/cn/protobuf
          protoc --version

      - name: Build unsigned IPA
        run: bash scripts/build-unsigned-ipa.sh

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "cn-$(date +%Y%m%d-%H%M)" "build/unsigned/Scrcpy-Remote-unsigned.ipa" \
            --title "Screen Remote 中文版（未签名 IPA）" \
            --notes "自动构建产物，未签名，请使用自己的证书签名后安装。"
