name: Bootstrap build (CN)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply patch
        run: git apply --verbose ScreenRemote-CN.patch

      - name: Init submodules
        run: git submodule update --init --recursive

      - name: Select newest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)"
          echo "Using $latest"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install build tools
        run: |
          brew install ninja meson pkg-config go fmt googletest nasm protobuf
          curl -fsSL --retry 5 --retry-delay 5 -o /tmp/protoc.zip \
            https://github.com/protocolbuffers/protobuf/releases/download/v28.3/protoc-28.3-osx-aarch_64.zip
          unzip -q /tmp/protoc.zip -d /tmp/protoc
          echo "/tmp/protoc/bin" >> "$GITHUB_PATH"
          /tmp/protoc/bin/protoc --version
          curl -fsSL --retry 5 --retry-delay 5 -o /tmp/cmake.tar.gz \
            https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-macos-universal.tar.gz
          tar -xzf /tmp/cmake.tar.gz -C /tmp
          echo "/tmp/cmake-3.31.6-macos-universal/CMake.app/Contents/bin" >> "$GITHUB_PATH"
          /tmp/cmake-3.31.6-macos-universal/CMake.app/Contents/bin/cmake --version

      - name: Prepare tsnet go.mod
        run: |
          if [ ! -f porting/libtsnet/go.mod ]; then
            cd porting/libtsnet
            go mod init me.wsen.scrcpy-tsnet
            go mod edit -go=1.23
            go get tailscale.com@v1.84.1
            go mod tidy
          fi

      - name: Restore native dependencies
        uses: actions/cache/restore@v4
        with:
          path: porting/libs
          key: native-deps-v8-${{ runner.os }}

      - name: Build unsigned IPA
        run: bash scripts/build-unsigned-ipa.sh

      - name: Save native dependencies
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: porting/libs
          key: native-deps-v8-${{ runner.os }}

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "cn-$(date +%Y%m%d-%H%M)" "build/unsigned/Scrcpy-Remote-unsigned.ipa" \
            --title "Screen Remote 中文版（未签名 IPA）" \
            --notes "自动构建产物，未签名，请使用自己的证书签名后安装。"




